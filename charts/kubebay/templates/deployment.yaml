{{- if lt (int .Values.auditLog.maxSizeMiB) 1 }}
{{- fail "auditLog.maxSizeMiB must be at least 1: without a cap the audit file can fill its volume" }}
{{- end }}
{{- $volMiB := include "kubebay.auditVolumeMiB" . | int }}
{{- if and (not .Values.auditLog.persistence.existingClaim) (gt (mul 2 (int .Values.auditLog.maxSizeMiB)) $volMiB) }}
{{- fail (printf "auditLog.maxSizeMiB (%d) is kept twice (audit.log and audit.log.1), which does not fit in %dMi: raise auditLog.persistence.size or lower maxSizeMiB. Without persistence the audit file shares the 64Mi /tmp volume." (int .Values.auditLog.maxSizeMiB) $volMiB) }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kubebay.name" . }}
  labels: { app: kubebay }
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels: { app: kubebay }
  template:
    metadata:
      labels: { app: kubebay }
    spec:
      serviceAccountName: {{ include "kubebay.name" . }}
      securityContext:
        runAsNonRoot: true
        {{- if .Values.auditLog.persistence.enabled }}
        # The engine runs as the image's nonroot user; the claim must be writable by it.
        fsGroup: 65532
        {{- end }}
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: engine
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["--addr", "0.0.0.0:8080", "--in-cluster"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            # The root filesystem is read-only; settings and the audit log go to /tmp.
            - name: HOME
              value: /tmp
            - name: XDG_CONFIG_HOME
              value: /tmp/.config
            # Every audit entry is also printed to stdout as one JSON line, for a log collector.
            # The file is capped: audit.log rotates to audit.log.1 at this size.
            - name: KUBEBAY_AUDIT_STDOUT
              value: {{ .Values.auditLog.stdout | quote }}
            - name: KUBEBAY_AUDIT_MAX_BYTES
              value: {{ mul .Values.auditLog.maxSizeMiB 1048576 | quote }}
            {{- if .Values.auditLog.persistence.enabled }}
            - name: KUBEBAY_AUDIT_DIR
              value: /var/lib/kubebay/audit
            {{- end }}
            # Settings that apply to every user are read-only in the app here;
            # the operator sets them through these values.
            {{- with .Values.nodeShellImage }}
            - name: KUBEBAY_NODE_SHELL_IMAGE
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.debugImage }}
            - name: KUBEBAY_DEBUG_IMAGE
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.prometheus.url }}
            - name: KUBEBAY_PROMETHEUS_URL
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.helmRepos }}
            - name: KUBEBAY_HELM_REPOS
              value: {{ $repos := list }}{{ range . }}{{ $repos = append $repos (printf "%s=%s" .name .url) }}{{ end }}{{ join "," $repos | quote }}
            {{- end }}
            {{- if .Values.prometheus.allUsers }}
            - name: KUBEBAY_PROMETHEUS_ALL_USERS
              value: "true"
            {{- end }}
            {{- if .Values.mcp.readOnly }}
            - name: KUBEBAY_MCP_READ_ONLY
              value: "true"
            {{- end }}
            {{- if .Values.authProxy.enabled }}
            # Sign-in comes from the authenticating proxy in front of the engine. The
            # engine honours these headers only from a peer inside trustedCIDRs.
            - name: KUBEBAY_AUTH_PROXY_USER_HEADER
              value: {{ .Values.authProxy.userHeader | quote }}
            {{- with .Values.authProxy.groupsHeader }}
            - name: KUBEBAY_AUTH_PROXY_GROUPS_HEADER
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.authProxy.trustedCIDRs }}
            - name: KUBEBAY_AUTH_PROXY_TRUSTED_CIDRS
              value: {{ join "," . | quote }}
            {{- end }}
            {{- if .Values.authProxy.allowAnyPeer }}
            - name: KUBEBAY_AUTH_PROXY_ALLOW_ANY_PEER
              value: "true"
            {{- end }}
            {{- if .Values.authProxy.allowSystemIdentities }}
            - name: KUBEBAY_AUTH_PROXY_ALLOW_SYSTEM_IDENTITIES
              value: "true"
            {{- end }}
            {{- if .Values.authProxy.secret.existingSecret }}
            - name: KUBEBAY_AUTH_PROXY_SECRET_HEADER
              value: {{ .Values.authProxy.secret.header | quote }}
            - name: KUBEBAY_AUTH_PROXY_SECRET_FILE
              value: /etc/kubebay/auth-proxy/secret
            {{- end }}
            {{- end }}
            {{- if .Values.oidc.issuerUrl }}
            - name: KUBEBAY_OIDC_ISSUER
              value: {{ .Values.oidc.issuerUrl | quote }}
            - name: KUBEBAY_OIDC_CLIENT_ID
              value: {{ .Values.oidc.clientId | quote }}
            - name: KUBEBAY_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "kubebay.name" . }}-oidc
                  key: client-secret
            - name: KUBEBAY_OIDC_REDIRECT
              value: {{ printf "https://%s/api/auth/callback" .Values.ingress.host | quote }}
            {{- end }}
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if and .Values.authProxy.enabled .Values.authProxy.secret.existingSecret }}
            - name: auth-proxy-secret
              mountPath: /etc/kubebay/auth-proxy
              readOnly: true
            {{- end }}
            {{- if .Values.auditLog.persistence.enabled }}
            - name: audit
              mountPath: /var/lib/kubebay/audit
            {{- end }}
          readinessProbe:
            httpGet: { path: /api/healthz, port: 8080 }
          livenessProbe:
            httpGet: { path: /api/healthz, port: 8080 }
            initialDelaySeconds: 10
          resources: {{ toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        {{- if and .Values.authProxy.enabled .Values.authProxy.secret.existingSecret }}
        - name: auth-proxy-secret
          secret:
            secretName: {{ .Values.authProxy.secret.existingSecret }}
            items:
              - key: {{ .Values.authProxy.secret.key }}
                path: secret
        {{- end }}
        {{- if .Values.auditLog.persistence.enabled }}
        - name: audit
          persistentVolumeClaim:
            claimName: {{ .Values.auditLog.persistence.existingClaim | default (printf "%s-audit" (include "kubebay.name" .)) }}
        {{- end }}
{{- if .Values.oidc.issuerUrl }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kubebay.name" . }}-oidc
stringData:
  client-secret: {{ .Values.oidc.clientSecret | quote }}
{{- end }}
