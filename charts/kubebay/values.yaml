image:
  repository: ghcr.io/rajasardar/kubebay
  tag: latest
  pullPolicy: IfNotPresent

replicaCount: 1

oidc:
  issuerUrl: ""
  clientId: ""
  clientSecret: ""
  redirectUrl: ""

# Sign in through an authenticating reverse proxy (oauth2-proxy, an ingress with
# auth, a corporate gateway) instead of OIDC. Never together with oidc.*.
# The engine reads the identity headers only from a peer whose address is inside
# trustedCIDRs, and refuses everyone else with a 401. Every other pod inside those
# ranges could forge an identity, so keep them to the proxy's own addresses and
# add a NetworkPolicy that lets only the proxy reach the engine.
authProxy:
  enabled: false
  userHeader: X-Auth-Request-Email
  groupsHeader: X-Auth-Request-Groups
  # Required, e.g. ["10.42.1.0/24"]: the addresses the proxy connects to the engine from.
  trustedCIDRs: []
  # Acknowledges the risk of trusting every peer (an empty or 0.0.0.0/0 range).
  allowAnyPeer: false
  # Lets the proxy name system: users and system:masters. Off.
  allowSystemIdentities: false
  # A header the proxy must send with a shared secret, read from an existing
  # Secret (never a value here). Required if trustedCIDRs is wider than a /24.
  secret:
    header: ""
    existingSecret: ""
    key: secret

# Who the engine may impersonate once OIDC or authProxy is on. Empty means any user or group, which
# includes system:masters; list the groups (and users) your IdP or proxy issues to narrow it.
impersonation:
  users: []
  groups: []

# Settings that apply to every user. In a cluster the app's Settings page can't
# change them, because one person would be choosing for everyone.
# Image of the privileged node-shell pod; empty = registry.k8s.io/e2e-test-images/busybox:1.29-2.
nodeShellImage: ""
# Default image of a debug container; empty = busybox:1.36.
debugImage: ""
# Helm repositories every user's chart installs come from. Users can't add,
# repoint or remove repositories in the app here; they can refresh these.
# Each is {name, url}. A repository that needs credentials goes in a mounted
# repositories.yaml named by HELM_REPOSITORY_CONFIG instead.
helmRepos: []
prometheus:
  # Prometheus the engine queries directly for graphs and right-sizing. Empty =
  # each user's queries go through the API server's service proxy as that user.
  url: ""
  # With OIDC, let every signed-in user send raw PromQL to `url`. It answers for
  # every namespace whatever their RBAC, so it's off unless you turn it on.
  allUsers: false

# The audit log of every change made through Kubebay.
auditLog:
  # Print every entry to stdout as one JSON line (time, user, action, gvr, cluster,
  # namespace, name, result), so a log collector keeps a copy outside the pod.
  stdout: true
  # The file rotates at this size (audit.log -> audit.log.1), so it takes at most twice
  # this on disk. Without persistence it shares the 64Mi /tmp volume with settings.
  maxSizeMiB: 16
  # Keep the file on a PersistentVolumeClaim so it survives a restart or reschedule.
  # The claim is ReadWriteOnce: with replicaCount above 1 use a storage class that allows it.
  persistence:
    enabled: false
    size: 1Gi
    storageClass: ""
    # Use a claim you made yourself; none is created, and size is not checked.
    existingClaim: ""

ingress:
  enabled: false
  className: nginx
  host: kubebay.example.com
  tls:
    enabled: false
    secretName: kubebay-tls

resources:
  requests:
    cpu: 50m
    memory: 96Mi
  limits:
    memory: 512Mi
