image:
  repository: ghcr.io/rajasardar/kubebay
  tag: latest
  pullPolicy: IfNotPresent

replicaCount: 1

oidc:
  issuerUrl: ""
  clientId: ""
  clientSecret: ""
  redirectUrl: ""

# Who the engine may impersonate once OIDC is on. Empty means any user or group, which
# includes system:masters; list the groups (and users) your IdP issues to narrow it.
impersonation:
  users: []
  groups: []

ingress:
  enabled: false
  className: nginx
  host: kubebay.example.com
  tls:
    enabled: false
    secretName: kubebay-tls

resources:
  requests:
    cpu: 50m
    memory: 96Mi
  limits:
    memory: 512Mi
