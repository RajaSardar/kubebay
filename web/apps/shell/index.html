<!doctype html>
<html lang="en" data-theme="dawn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f2f2f7" />
    <!-- Resolve the saved theme before first paint so a light-theme user never
         sees a dark frame. Mirrors resolveTheme() in src/lib/theme.ts; the
         colours are each theme's --kb-theme-color (themeBoot.test.ts checks both). -->
    <script id="kb-theme-boot">
      (function () {
        var colors = {"dusk":"#161617","dawn":"#f2f2f7","dusk-hc":"#000000","dawn-hc":"#ffffff","vscode-dark":"#1e1e1e","vscode-light":"#f3f3f3","one-dark":"#282c34","dracula":"#282a36","nord":"#2e3440","github-dark":"#0d1117","github-light":"#f6f8fa","catppuccin":"#1e1e2e"};
        var t = "dawn";
        try {
          if (localStorage.getItem("kb.theme.version")) t = localStorage.getItem("kb.theme") || "dawn";
        } catch (e) {}
        if (t === "system") {
          var mm = function (q) { return window.matchMedia && window.matchMedia(q).matches; };
          t = (mm("(prefers-color-scheme: dark)") ? "dusk" : "dawn") + (mm("(prefers-contrast: more)") ? "-hc" : "");
        }
        if (!colors[t]) t = "dawn";
        document.documentElement.setAttribute("data-theme", t);
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute("content", colors[t]);
      })();
    </script>
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%2322d3ee'/%3E%3Cstop offset='1' stop-color='%2341c98e'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='9' fill='url(%23g)'/%3E%3Ccircle cx='16' cy='14.5' r='5.4' fill='none' stroke='%23fff' stroke-width='2'/%3E%3Cpath d='M7.5 22.5c2.6 2.3 5.4 3.4 8.5 3.4s5.9-1.1 8.5-3.4' fill='none' stroke='%23fff' stroke-width='2' stroke-linecap='round'/%3E%3Cpath d='M16 9v11M10 13.5h12' stroke='%23fff' stroke-width='2' stroke-linecap='round' opacity='.85'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <title>Kubebay</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
