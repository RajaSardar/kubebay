name: Bug report
description: Something is broken — tell us exactly what
labels: [bug, triage]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file this. Please redact any cluster names,
        tokens, or kubeconfig contents before submitting.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect to happen instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start engine with `make run`
        2. Open …
        3. …
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Surface
      options:
        - Engine (Go)
        - Web UI
        - Desktop (planned)
        - In-cluster mode (planned)
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
      placeholder: output of `git rev-parse --short HEAD`
    validations:
      required: true
  - type: dropdown
    id: k8s-version
    attributes:
      label: Kubernetes version (if relevant)
      options:
        - "1.34"
        - "1.33"
        - "1.32"
        - "1.31"
        - "older / not relevant"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant log output (redacted)
      render: shell
