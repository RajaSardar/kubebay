name: publish

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read
  packages: write
  id-token: write      # keyless cosign signing and build provenance (KB-05)
  attestations: write  # GitHub artifact attestations

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # The engine reports what the release binaries do for a tag, and the
          # commit for a main build, instead of "dev".
          build-args: VERSION=${{ github.ref_type == 'tag' && github.ref_name || format('main-{0}', github.sha) }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # KB-05: sign the pushed image by digest, keylessly, with this
      # workflow's GitHub identity. cosign v2.6 stores the signature as a
      # .sig tag, the format Kubebay's own signature check verifies.
      - name: Image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: sigstore/cosign-installer@v3
        with:
          cosign-release: v2.6.0
      - name: Sign the image
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"
      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
