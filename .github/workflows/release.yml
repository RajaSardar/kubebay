name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  # ── CLI engine tarballs (headless, all platforms) ──────────────────────────
  engine-binaries:
    strategy:
      matrix:
        include:
          - { goos: darwin,  goarch: arm64 }
          - { goos: darwin,  goarch: amd64 }
          - { goos: linux,   goarch: amd64 }
          - { goos: linux,   goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: cd web && pnpm install --frozen-lockfile && pnpm build
      - uses: actions/setup-go@v5
        with:
          go-version-file: engine/go.mod
      - name: Build embedded engine binary
        run: |
          rm -rf engine/internal/httpapi/static/dist
          mkdir -p engine/internal/httpapi/static
          cp -R web/apps/shell/dist engine/internal/httpapi/static/dist
          cd engine
          CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
            go build -trimpath -ldflags "-s -w -X main.version=${{ github.ref_name }}" \
            -o ../kubebay ./cmd/kubebay
      - name: Package
        run: |
          DIR="kubebay-${{ matrix.goos }}-${{ matrix.goarch }}"
          mkdir "$DIR"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            mv kubebay "$DIR/kubebay.exe"
          else
            cp kubebay "$DIR/"
          fi
          cp README.md LICENSE "$DIR/"
          tar czf "$DIR.tar.gz" "$DIR"
          shasum -a 256 "$DIR.tar.gz" > "$DIR.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: engine-${{ matrix.goos }}-${{ matrix.goarch }}
          path: kubebay-*.tar.gz*

  # ── Desktop app installers (native runners, Tauri) ────────────────────────
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14          # Apple Silicon
            rust-target: aarch64-apple-darwin
            go-os: darwin
            go-arch: arm64
            sidecar: kubebay-engine-aarch64-apple-darwin
            bundles: dmg

          - os: macos-13          # Intel Mac
            rust-target: x86_64-apple-darwin
            go-os: darwin
            go-arch: amd64
            sidecar: kubebay-engine-x86_64-apple-darwin
            bundles: dmg

          - os: windows-latest
            rust-target: x86_64-pc-windows-msvc
            go-os: windows
            go-arch: amd64
            sidecar: kubebay-engine-x86_64-pc-windows-msvc.exe
            bundles: nsis

          - os: ubuntu-22.04
            rust-target: x86_64-unknown-linux-gnu
            go-os: linux
            go-arch: amd64
            sidecar: kubebay-engine-x86_64-unknown-linux-gnu
            bundles: deb,appimage

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # ── Web build ──────────────────────────────────────────────────────────
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: cd web && pnpm install --frozen-lockfile && pnpm build

      # ── Embed SPA into engine source ───────────────────────────────────────
      - name: Sync web assets into engine
        shell: bash
        run: |
          rm -rf engine/internal/httpapi/static/dist
          mkdir -p engine/internal/httpapi/static
          cp -R web/apps/shell/dist engine/internal/httpapi/static/dist

      # ── Build the Go engine sidecar for this platform ─────────────────────
      - uses: actions/setup-go@v5
        with:
          go-version-file: engine/go.mod
      - name: Build engine sidecar
        shell: bash
        env:
          GOOS: ${{ matrix.go-os }}
          GOARCH: ${{ matrix.go-arch }}
          CGO_ENABLED: "0"
        run: |
          mkdir -p desktop/src-tauri/binaries
          cd engine
          go build -trimpath \
            -ldflags "-s -w -X main.version=${{ github.ref_name }}" \
            -o "../desktop/src-tauri/binaries/${{ matrix.sidecar }}" \
            ./cmd/kubebay

      # ── Stamp version into tauri.conf.json ────────────────────────────────
      - name: Set app version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            sed -i '' "s/\"version\": \"[^\"]*\"/\"version\": \"$VERSION\"/" desktop/src-tauri/tauri.conf.json
          else
            sed -i "s/\"version\": \"[^\"]*\"/\"version\": \"$VERSION\"/" desktop/src-tauri/tauri.conf.json
          fi

      # ── Linux system dependencies for WebKit / GTK ────────────────────────
      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      # ── Rust + cache ──────────────────────────────────────────────────────
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workdir: desktop/src-tauri

      # ── Tauri build ───────────────────────────────────────────────────────
      - name: Build Tauri desktop app
        run: pnpm tauri build --target ${{ matrix.rust-target }} --bundles ${{ matrix.bundles }}
        working-directory: desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ""   # unsigned build — users right-click > Open on macOS

      # ── Collect installer artifacts ───────────────────────────────────────
      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p dist
          find desktop/src-tauri/target -type f \( \
            -name "*.dmg" \
            -o -name "*-setup.exe" \
            -o -name "*.msi" \
            -o -name "*.deb" \
            -o -name "*.AppImage" \
          \) | while read f; do
            cp "$f" dist/
            echo "collected: $f"
          done
          ls -lh dist/

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: dist/*

  # ── Single GitHub release combining everything ────────────────────────────
  github-release:
    needs: [engine-binaries, desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist
      - name: List release artifacts
        run: ls -lh dist/
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

  # ── Homebrew tap update (CLI engine) ──────────────────────────────────────
  homebrew-tap:
    needs: github-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update homebrew tap
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          gh repo clone RajaSardar/homebrew-tap tap || { echo "tap missing; create RajaSardar/homebrew-tap"; exit 1; }
          cd tap
          ARM=$(curl -sL "https://github.com/RajaSardar/kubebay/releases/download/$TAG/kubebay-darwin-arm64.tar.gz.sha256" | awk '{print $1}')
          AMD=$(curl -sL "https://github.com/RajaSardar/kubebay/releases/download/$TAG/kubebay-darwin-amd64.tar.gz.sha256" | awk '{print $1}')
          mkdir -p Formula
          cat > Formula/kubebay.rb <<RUBY
          class Kubebay < Formula
            desc "Local-first Kubernetes IDE — engine + web UI in one binary"
            homepage "https://github.com/RajaSardar/kubebay"
            version "$VERSION"

            on_macos do
              if Hardware::CPU.arm?
                url "https://github.com/RajaSardar/kubebay/releases/download/#{version}/kubebay-darwin-arm64.tar.gz"
                sha256 "$ARM"
              else
                url "https://github.com/RajaSardar/kubebay/releases/download/#{version}/kubebay-darwin-amd64.tar.gz"
                sha256 "$AMD"
              end
            end
            on_linux do
              if Hardware::CPU.arm? || Hardware::CPU.intel?
                url "https://github.com/RajaSardar/kubebay/releases/download/#{version}/kubebay-linux-#{Hardware::CPU.arm? ? "arm64" : "amd64"}.tar.gz"
                sha256 "LINUX_PLACEHOLDER"
              end
            end

            def install
              bin.install "kubebay"
            end

            service do
              run [bin/"kubebay", "--addr", "127.0.0.1:9898", "--no-open"]
              keep_alive true
            end

            def caveats
              <<~EOS
                Run directly:  kubebay
                As a service:  brew services start rajasardar/tap/kubebay
                The UI token is printed on first start.
              EOS
            end
          end
          RUBY
          git config user.name "kubebay-release-bot"
          git config user.email "bot@kubebay.local"
          git add Formula/kubebay.rb
          git commit -m "kubebay $VERSION" || echo "no changes"
          git push
