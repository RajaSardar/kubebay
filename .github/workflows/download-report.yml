name: download report

# KB-17 step 1: a monthly adoption report from public data (release download
# counts, stars, forks). Nothing in the app is involved and nothing is sent
# from anyone's machine. The report is the run's job summary.
on:
  schedule:
    - cron: "17 6 1 * *" # 06:17 UTC on the 1st of each month
  workflow_dispatch:

permissions:
  contents: read
  actions: read # to fetch the previous run's snapshot

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Download counts are cumulative: the month's numbers are the difference
      # from the last successful run's snapshot. The first run has totals only.
      - name: Previous snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow download-report.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          if [ -n "$id" ]; then
            gh run download "$id" --repo "$GITHUB_REPOSITORY" --name download-report --dir previous || echo "no snapshot in run $id"
          fi
      - name: Report
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          prev=()
          if [ -f previous/download-report.json ]; then prev=(--previous previous/download-report.json); fi
          node scripts/download-report.mjs --repo "$GITHUB_REPOSITORY" "${prev[@]}" \
            --out download-report.json --summary "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: download-report
          path: download-report.json
          retention-days: 90
