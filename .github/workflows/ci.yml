name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  engine:
    name: engine (go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: engine/go.mod
      # internal/httpapi embeds this directory (`//go:embed all:static`) to
      # serve the built frontend from the binary; go:embed fails to compile
      # against an empty/missing directory, and this job never runs the
      # frontend build that would normally populate it.
      - run: mkdir -p internal/httpapi/static/dist && touch internal/httpapi/static/dist/.gitkeep
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
      # The local shell is never shipped, but it must not rot: compile and test
      # it here, and prove it still cross-compiles for the Windows release
      # target with CGO off.  No release or container build passes this tag.
      - run: go build -tags localshell ./...
      - run: go vet -tags localshell ./...
      - run: go test -tags localshell ./...
      - run: CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -tags localshell ./...

  web:
    name: web (pnpm)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          # jsdom 30 (the test environment) needs ^22.22.2 || ^24.15 || >=26;
          # on Node 20 vitest can't even load it.
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # CLAUDE.md's CI gate: the shell suite, including the design-system
      # guard tests (shellAdoption, themeTokens, themeContrast).
      - run: pnpm --filter @kubebay/shell test
      - run: pnpm build

  desktop:
    name: desktop (rust)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop/src-tauri
    steps:
      - uses: actions/checkout@v4
      # Tauri's Linux prerequisites (GTK and WebKitGTK 4.1). The shipped app
      # is macOS, but the Rust (token injection, stop_engine, env forwarding)
      # is shared and must not rot uncompiled.
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libxdo-dev libssl-dev libayatana-appindicator3-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      # tauri-build requires the engine sidecar named in externalBin, and the
      # frontendDist directory, to exist; this job builds neither.
      - run: mkdir -p binaries ../../web/apps/shell/dist && touch binaries/kubebay-engine-x86_64-unknown-linux-gnu && chmod +x binaries/kubebay-engine-x86_64-unknown-linux-gnu && touch ../../web/apps/shell/dist/index.html
      - run: cargo build --locked
      - run: cargo test --locked

  # KB-14: build the desktop app on Windows and Linux as the release does,
  # launch it with KUBEBAY_SMOKE=1, and pass only if the engine comes up and
  # the shell paints (the app exits 0 then, and 1 after 90 s otherwise).
  desktop-smoke:
    name: desktop smoke (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            sidecar: kubebay-engine-x86_64-pc-windows-msvc.exe
            app: desktop/src-tauri/target/release/kubebay.exe
          - os: ubuntu-22.04
            sidecar: kubebay-engine-x86_64-unknown-linux-gnu
            app: desktop/src-tauri/target/release/kubebay
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Build the web UI
        shell: bash
        run: cd web && pnpm install --frozen-lockfile && pnpm build
      - name: Embed it in the engine
        shell: bash
        run: |
          rm -rf engine/internal/httpapi/static/dist
          mkdir -p engine/internal/httpapi/static
          cp -R web/apps/shell/dist engine/internal/httpapi/static/dist
      - uses: actions/setup-go@v5
        with:
          go-version-file: engine/go.mod
      - name: Build the engine sidecar
        shell: bash
        env:
          CGO_ENABLED: "0"
          SIDECAR: ${{ matrix.sidecar }}
        run: |
          mkdir -p desktop/src-tauri/binaries
          cd engine
          go build -trimpath -o "../desktop/src-tauri/binaries/$SIDECAR" ./cmd/kubebay
      - name: Install Linux build and display deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xvfb
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - name: Build the desktop app
        working-directory: desktop/src-tauri
        run: cargo build --release --locked
      - name: Launch it (Linux)
        if: runner.os == 'Linux'
        env:
          APP: ${{ matrix.app }}
        run: KUBEBAY_SMOKE=1 timeout 180 xvfb-run -a "$PWD/$APP"
      - name: Launch it (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          APP: ${{ matrix.app }}
        run: |
          $env:KUBEBAY_SMOKE = "1"
          $p = Start-Process -FilePath $env:APP -PassThru -NoNewWindow -RedirectStandardError smoke-stderr.log -RedirectStandardOutput smoke-stdout.log
          $null = $p.Handle  # keeps ExitCode readable after the process ends
          $done = $p.WaitForExit(180000)
          Get-Content smoke-stderr.log -ErrorAction SilentlyContinue
          if (-not $done) { Stop-Process -Id $p.Id -Force; Write-Error "the app did not exit within 3 minutes"; exit 1 }
          exit $p.ExitCode

  website:
    name: website (astro)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      # KB-02: every comparison cell names its source.
      - run: npm test
      - run: npm run build

  scripts:
    name: scripts (node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # Release tooling: installer sizes (KB-02), the air-gapped bundle (KB-21);
      # the performance harness's pure parts and budgets (KB-02).
      - run: node --test scripts/*.test.mjs perf/*.test.mjs

  integration:
    name: integration (kind)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: engine/go.mod
      # The oldest Kubernetes the suite runs on (KB-12). This is what kind-action
      # v1.10.0 created by default; it's pinned so a bump is a visible change.
      - uses: helm/kind-action@v1.10.0
        with:
          cluster_name: kubebay-ci
          version: v0.22.0
          node_image: kindest/node:v1.29.2@sha256:51a1434a5397193442f0be2a297b488b6c919ce8a3931be0ce822606ea5ca245
      # internal/integration imports internal/httpapi, which embeds this
      # directory (`//go:embed all:static`); go:embed fails to compile
      # against an empty/missing directory, and this job never runs the
      # frontend build that would normally populate it.
      - run: mkdir -p internal/httpapi/static/dist && touch internal/httpapi/static/dist/.gitkeep
      - name: Live delta-stream round-trip test
        run: KUBEBAY_INTEGRATION_TEST=1 go test ./internal/integration/ -v -timeout 300s

  # KB-12: the same suite on newer Kubernetes. 1.34 is the first with Dynamic
  # Resource Allocation GA (the DRA stream test runs there and on 1.37), and
  # 1.37 is the newest. A separate job, so the "integration (kind)" check
  # keeps its name.
  integration-versions:
    name: integration (kind, Kubernetes ${{ matrix.k8s }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - k8s: "1.34"
            image: kindest/node:v1.34.11@sha256:44e222ee2132dab25ff87301682f89eb82c7880ea3a1bf543bfe9708fd08d67d
          - k8s: "1.37"
            image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: engine/go.mod
      - uses: helm/kind-action@v1.10.0
        with:
          cluster_name: kubebay-ci
          version: v0.33.0
          node_image: ${{ matrix.image }}
          # No kubectl_version: kind-action v1.10.0 fetches kubectl from the old
          # kubernetes-release bucket, which has nothing newer than 2023. The
          # suite talks to the API with client-go, not kubectl.
      - run: mkdir -p internal/httpapi/static/dist && touch internal/httpapi/static/dist/.gitkeep
      - name: Live integration suite
        run: KUBEBAY_INTEGRATION_TEST=1 go test ./internal/integration/ -v -timeout 300s

  # KB-11: the golden path in a real browser against a real cluster: connect,
  # Pods, logs streaming, an exec round-trip, a port-forward, and a YAML edit
  # with a dry-run diff, applied. See docs/E2E.md.
  e2e:
    name: e2e (kind)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      KUBEBAY_TOKEN: e2e-token
      KUBEBAY_E2E_CONTEXT: kind-kubebay-e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: engine/go.mod
          cache-dependency-path: engine/go.sum
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      # The same Kubernetes as the newest-but-one integration leg.
      - uses: helm/kind-action@v1.10.0
        with:
          cluster_name: kubebay-e2e
          version: v0.33.0
          node_image: kindest/node:v1.34.11@sha256:44e222ee2132dab25ff87301682f89eb82c7880ea3a1bf543bfe9708fd08d67d
      - name: Fixture pod
        run: |
          kubectl create -f e2e/fixtures/golden-path.yaml
          kubectl -n kubebay-e2e wait --for=condition=Ready pod/e2e-logger --timeout=180s
      - name: Build the engine with the web app embedded
        run: make web-install build
      - name: Start the engine
        run: |
          # Its own kubeconfig and home, never the runner's defaults.
          kind get kubeconfig --name kubebay-e2e > "$RUNNER_TEMP/kubeconfig"
          mkdir -p "$RUNNER_TEMP/home"
          HOME="$RUNNER_TEMP/home" nohup engine/bin/kubebay --addr 127.0.0.1:9898 --no-open \
            --kubeconfig "$RUNNER_TEMP/kubeconfig" --token-file "$RUNNER_TEMP/session-token" \
            > "$RUNNER_TEMP/engine.log" 2>&1 &
          for _ in $(seq 1 30); do curl -sf http://127.0.0.1:9898/api/healthz && exit 0; sleep 1; done
          cat "$RUNNER_TEMP/engine.log"
          exit 1
      - name: Golden path
        working-directory: e2e
        env:
          KUBECONFIG: ${{ runner.temp }}/kubeconfig
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test tests/golden-path.spec.ts
      - name: Summary
        if: always()
        working-directory: e2e
        run: |
          [ -f results.json ] || exit 0
          node -e '
            const s = require("./results.json").stats;
            const line = `e2e (kind): ${s.expected} passed, ${s.unexpected} failed, ${s.flaky} flaky, ${(s.duration / 1000).toFixed(1)} s`;
            console.log(line);
            require("fs").appendFileSync(process.env.GITHUB_STEP_SUMMARY, line + "\n");
          '
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-report
          path: |
            e2e/playwright-report
            e2e/test-results
            ${{ runner.temp }}/engine.log
          retention-days: 14

  # KB-02: engine memory, CPU and cold start against the PRD §6 budgets. Over
  # budget is a warning until three stable runs on main; then the budgets step
  # gets --fail. Method: docs/PERFORMANCE.md.
  perf:
    name: perf (kind)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: engine/go.mod
          cache-dependency-path: engine/go.sum
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: helm/kind-action@v1.10.0
        with:
          cluster_name: kubebay-perf
          version: v0.33.0
          node_image: kindest/node:v1.34.11@sha256:44e222ee2132dab25ff87301682f89eb82c7880ea3a1bf543bfe9708fd08d67d
      - name: Build the engine with the web app embedded
        run: make web-install build
      - name: Measure
        run: |
          (cd perf && npm ci && npx playwright-core install --with-deps chromium)
          kind get kubeconfig --name kubebay-perf > "$RUNNER_TEMP/kubeconfig"
          node perf/harness.mjs --engine engine/bin/kubebay --kubeconfig "$RUNNER_TEMP/kubeconfig" \
            --context kind-kubebay-perf --out perf/perf.json
      # Over budget fails the job (KB-02 step 4, since 2026-10-17, after three
      # stable runs on main). A budget changes only through an ADR.
      - name: Budgets
        if: always() && hashFiles('perf/perf.json') != ''
        run: node scripts/perf-budgets.mjs --results perf/perf.json --budgets perf/budgets.json --summary "$GITHUB_STEP_SUMMARY" --fail
      - uses: actions/upload-artifact@v4
        if: always() && hashFiles('perf/perf.json') != ''
        with:
          name: perf
          path: perf/perf.json
          retention-days: 90

  # KB-12's acceptance: the DRA tables against a kind cluster running the DRA
  # example driver. Its v0.5.0 release is tested on Kubernetes 1.37 with its own
  # cluster config (feature gates, CDI), which this job uses as it is.
  e2e-dra:
    name: e2e dra (kind, Kubernetes 1.37)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      KUBEBAY_TOKEN: e2e-token
      KUBEBAY_E2E_CONTEXT: kind-kubebay-dra
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: engine/go.mod
          cache-dependency-path: engine/go.sum
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: The DRA example driver (v0.5.0)
        run: git clone --depth 1 --branch v0.5.0 https://github.com/kubernetes-sigs/dra-example-driver "$RUNNER_TEMP/dra-example-driver"
      - uses: helm/kind-action@v1.10.0
        with:
          cluster_name: kubebay-dra
          version: v0.33.0
          node_image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
          config: ${{ runner.temp }}/dra-example-driver/demo/scripts/kind-cluster-config.yaml
      - uses: azure/setup-helm@v4
        with:
          version: v3.19.5
      - name: Driver and fixture
        run: |
          helm upgrade -i --create-namespace --namespace dra-example-driver dra-example-driver \
            "$RUNNER_TEMP/dra-example-driver/deployments/helm/dra-example-driver" --wait --timeout 5m
          for _ in $(seq 1 60); do [ -n "$(kubectl get resourceslices -o name)" ] && break; sleep 2; done
          kubectl get deviceclasses,resourceslices
          kubectl create -f e2e/fixtures/dra-claim.yaml
          kubectl -n kubebay-dra wait --for=condition=Ready pod/e2e-gpu-pod --timeout=180s
          kubectl -n kubebay-dra get resourceclaims
      - name: Build the engine with the web app embedded
        run: make web-install build
      - name: Start the engine
        run: |
          kind get kubeconfig --name kubebay-dra > "$RUNNER_TEMP/kubeconfig"
          mkdir -p "$RUNNER_TEMP/home"
          HOME="$RUNNER_TEMP/home" nohup engine/bin/kubebay --addr 127.0.0.1:9898 --no-open \
            --kubeconfig "$RUNNER_TEMP/kubeconfig" --token-file "$RUNNER_TEMP/session-token" \
            > "$RUNNER_TEMP/engine.log" 2>&1 &
          for _ in $(seq 1 30); do curl -sf http://127.0.0.1:9898/api/healthz && exit 0; sleep 1; done
          cat "$RUNNER_TEMP/engine.log"
          exit 1
      - name: DRA tables
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test tests/dra.spec.ts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-dra-report
          path: |
            e2e/playwright-report
            e2e/test-results
            ${{ runner.temp }}/engine.log
          retention-days: 14
