name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  engine:
    name: engine (go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: engine/go.mod
      # internal/httpapi embeds this directory (`//go:embed all:static`) to
      # serve the built frontend from the binary; go:embed fails to compile
      # against an empty/missing directory, and this job never runs the
      # frontend build that would normally populate it.
      - run: mkdir -p internal/httpapi/static/dist && touch internal/httpapi/static/dist/.gitkeep
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
      # The local shell is never shipped, but it must not rot: compile and test
      # it here, and prove it still cross-compiles for the Windows release
      # target with CGO off.  No release or container build passes this tag.
      - run: go build -tags localshell ./...
      - run: go vet -tags localshell ./...
      - run: go test -tags localshell ./...
      - run: CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -tags localshell ./...

  web:
    name: web (pnpm)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          # jsdom 30 (the test environment) needs ^22.22.2 || ^24.15 || >=26;
          # on Node 20 vitest can't even load it.
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # CLAUDE.md's CI gate: the shell suite, including the design-system
      # guard tests (shellAdoption, themeTokens, themeContrast).
      - run: pnpm --filter @kubebay/shell test
      - run: pnpm build

  desktop:
    name: desktop (rust)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop/src-tauri
    steps:
      - uses: actions/checkout@v4
      # Tauri's Linux prerequisites (GTK and WebKitGTK 4.1). The shipped app
      # is macOS, but the Rust (token injection, stop_engine, env forwarding)
      # is shared and must not rot uncompiled.
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libxdo-dev libssl-dev libayatana-appindicator3-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      # tauri-build requires the engine sidecar named in externalBin, and the
      # frontendDist directory, to exist; this job builds neither.
      - run: mkdir -p binaries ../../web/apps/shell/dist && touch binaries/kubebay-engine-x86_64-unknown-linux-gnu && chmod +x binaries/kubebay-engine-x86_64-unknown-linux-gnu && touch ../../web/apps/shell/dist/index.html
      - run: cargo build --locked
      - run: cargo test --locked

  # KB-14: build the desktop app on Windows and Linux as the release does,
  # launch it with KUBEBAY_SMOKE=1, and pass only if the engine comes up and
  # the shell paints (the app exits 0 then, and 1 after 90 s otherwise).
  desktop-smoke:
    name: desktop smoke (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            sidecar: kubebay-engine-x86_64-pc-windows-msvc.exe
            app: desktop/src-tauri/target/release/kubebay.exe
          - os: ubuntu-22.04
            sidecar: kubebay-engine-x86_64-unknown-linux-gnu
            app: desktop/src-tauri/target/release/kubebay
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Build the web UI
        shell: bash
        run: cd web && pnpm install --frozen-lockfile && pnpm build
      - name: Embed it in the engine
        shell: bash
        run: |
          rm -rf engine/internal/httpapi/static/dist
          mkdir -p engine/internal/httpapi/static
          cp -R web/apps/shell/dist engine/internal/httpapi/static/dist
      - uses: actions/setup-go@v5
        with:
          go-version-file: engine/go.mod
      - name: Build the engine sidecar
        shell: bash
        env:
          CGO_ENABLED: "0"
          SIDECAR: ${{ matrix.sidecar }}
        run: |
          mkdir -p desktop/src-tauri/binaries
          cd engine
          go build -trimpath -o "../desktop/src-tauri/binaries/$SIDECAR" ./cmd/kubebay
      - name: Install Linux build and display deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xvfb
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - name: Build the desktop app
        working-directory: desktop/src-tauri
        run: cargo build --release --locked
      - name: Launch it (Linux)
        if: runner.os == 'Linux'
        env:
          APP: ${{ matrix.app }}
        run: KUBEBAY_SMOKE=1 timeout 180 xvfb-run -a "$PWD/$APP"
      - name: Launch it (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          APP: ${{ matrix.app }}
        run: |
          $env:KUBEBAY_SMOKE = "1"
          $p = Start-Process -FilePath $env:APP -PassThru -NoNewWindow -RedirectStandardError smoke-stderr.log -RedirectStandardOutput smoke-stdout.log
          $null = $p.Handle  # keeps ExitCode readable after the process ends
          $done = $p.WaitForExit(180000)
          Get-Content smoke-stderr.log -ErrorAction SilentlyContinue
          if (-not $done) { Stop-Process -Id $p.Id -Force; Write-Error "the app did not exit within 3 minutes"; exit 1 }
          exit $p.ExitCode

  website:
    name: website (astro)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      # KB-02: every comparison cell names its source.
      - run: npm test
      - run: npm run build

  scripts:
    name: scripts (node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # Release tooling: installer sizes (KB-02), the air-gapped bundle (KB-21);
      # the performance harness's pure parts and budgets (KB-02).
      - run: node --test scripts/*.test.mjs perf/*.test.mjs

  integration:
    name: integration (kind)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: engine/go.mod
      # The oldest Kubernetes the suite runs on (KB-12). This is what kind-action
      # v1.10.0 created by default; it's pinned so a bump is a visible change.
      - uses: helm/kind-action@v1.10.0
        with:
          cluster_name: kubebay-ci
          version: v0.22.0
          node_image: kindest/node:v1.29.2@sha256:51a1434a5397193442f0be2a297b488b6c919ce8a3931be0ce822606ea5ca245
      # internal/integration imports internal/httpapi, which embeds this
      # directory (`//go:embed all:static`); go:embed fails to compile
      # against an empty/missing directory, and this job never runs the
      # frontend build that would normally populate it.
      - run: mkdir -p internal/httpapi/static/dist && touch internal/httpapi/static/dist/.gitkeep
      - name: Live delta-stream round-trip test
        run: KUBEBAY_INTEGRATION_TEST=1 go test ./internal/integration/ -v -timeout 300s

  # KB-12: the same suite on newer Kubernetes. 1.34 is the first with Dynamic
  # Resource Allocation GA (the DRA stream test runs there and on 1.37), and
  # 1.37 is the newest. A separate job, so the "integration (kind)" check
  # keeps its name.
  integration-versions:
    name: integration (kind, Kubernetes ${{ matrix.k8s }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - k8s: "1.34"
            image: kindest/node:v1.34.11@sha256:44e222ee2132dab25ff87301682f89eb82c7880ea3a1bf543bfe9708fd08d67d
          - k8s: "1.37"
            image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: engine/go.mod
      - uses: helm/kind-action@v1.10.0
        with:
          cluster_name: kubebay-ci
          version: v0.33.0
          node_image: ${{ matrix.image }}
          # No kubectl_version: kind-action v1.10.0 fetches kubectl from the old
          # kubernetes-release bucket, which has nothing newer than 2023. The
          # suite talks to the API with client-go, not kubectl.
      - run: mkdir -p internal/httpapi/static/dist && touch internal/httpapi/static/dist/.gitkeep
      - name: Live integration suite
        run: KUBEBAY_INTEGRATION_TEST=1 go test ./internal/integration/ -v -timeout 300s

  # KB-02: engine memory, CPU and cold start against the PRD §6 budgets. Over
  # budget is a warning until three stable runs on main; then the budgets step
  # gets --fail. Method: docs/PERFORMANCE.md.
  perf:
    name: perf (kind)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: engine/go.mod
          cache-dependency-path: engine/go.sum
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: helm/kind-action@v1.10.0
        with:
          cluster_name: kubebay-perf
          version: v0.33.0
          node_image: kindest/node:v1.34.11@sha256:44e222ee2132dab25ff87301682f89eb82c7880ea3a1bf543bfe9708fd08d67d
      - name: Build the engine with the web app embedded
        run: make web-install build
      - name: Measure
        run: |
          (cd perf && npm ci && npx playwright-core install --with-deps chromium)
          kind get kubeconfig --name kubebay-perf > "$RUNNER_TEMP/kubeconfig"
          node perf/harness.mjs --engine engine/bin/kubebay --kubeconfig "$RUNNER_TEMP/kubeconfig" \
            --context kind-kubebay-perf --out perf/perf.json
      - name: Budgets
        if: always() && hashFiles('perf/perf.json') != ''
        run: node scripts/perf-budgets.mjs --results perf/perf.json --budgets perf/budgets.json --summary "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always() && hashFiles('perf/perf.json') != ''
        with:
          name: perf
          path: perf/perf.json
          retention-days: 90
