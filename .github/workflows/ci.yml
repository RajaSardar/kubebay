name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  engine:
    name: engine (go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: engine/go.mod
      # internal/httpapi embeds this directory (`//go:embed all:static`) to
      # serve the built frontend from the binary; go:embed fails to compile
      # against an empty/missing directory, and this job never runs the
      # frontend build that would normally populate it.
      - run: mkdir -p internal/httpapi/static/dist && touch internal/httpapi/static/dist/.gitkeep
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
      # The local shell is never shipped, but it must not rot: compile and test
      # it here, and prove it still cross-compiles for the Windows release
      # target with CGO off.  No release or container build passes this tag.
      - run: go build -tags localshell ./...
      - run: go vet -tags localshell ./...
      - run: go test -tags localshell ./...
      - run: CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -tags localshell ./...

  web:
    name: web (pnpm)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          # jsdom 30 (the test environment) needs ^22.22.2 || ^24.15 || >=26;
          # on Node 20 vitest can't even load it.
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # CLAUDE.md's CI gate: the shell suite, including the design-system
      # guard tests (shellAdoption, themeTokens, themeContrast).
      - run: pnpm --filter @kubebay/shell test
      - run: pnpm build

  desktop:
    name: desktop (rust)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop/src-tauri
    steps:
      - uses: actions/checkout@v4
      # Tauri's Linux prerequisites (GTK and WebKitGTK 4.1). The shipped app
      # is macOS, but the Rust (token injection, stop_engine, env forwarding)
      # is shared and must not rot uncompiled.
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libxdo-dev libssl-dev libayatana-appindicator3-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      # tauri-build requires the engine sidecar named in externalBin, and the
      # frontendDist directory, to exist; this job builds neither.
      - run: mkdir -p binaries ../../web/apps/shell/dist && touch binaries/kubebay-engine-x86_64-unknown-linux-gnu && chmod +x binaries/kubebay-engine-x86_64-unknown-linux-gnu && touch ../../web/apps/shell/dist/index.html
      - run: cargo build --locked
      - run: cargo test --locked

  integration:
    name: integration (kind)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: engine/go.mod
      - uses: helm/kind-action@v1.10.0
        with:
          cluster_name: kubebay-ci
      # internal/integration imports internal/httpapi, which embeds this
      # directory (`//go:embed all:static`); go:embed fails to compile
      # against an empty/missing directory, and this job never runs the
      # frontend build that would normally populate it.
      - run: mkdir -p internal/httpapi/static/dist && touch internal/httpapi/static/dist/.gitkeep
      - name: Live delta-stream round-trip test
        run: KUBEBAY_INTEGRATION_TEST=1 go test ./internal/integration/ -v -timeout 300s
