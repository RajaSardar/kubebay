# Three unreachable clusters for rendering the app offline (theme audit,
# screenshots). Nothing listens on these ports; no real cluster is touched.
apiVersion: v1
kind: Config
clusters:
- name: kind-dev
  cluster: { server: "https://127.0.0.1:6551" }
- name: prod-eks
  cluster: { server: "https://127.0.0.1:6552" }
- name: staging-gke
  cluster: { server: "https://127.0.0.1:6553" }
users:
- name: u
  user: { token: "x" }
contexts:
- name: kind-dev
  context: { cluster: kind-dev, user: u }
- name: arn:aws:eks:us-east-1:123:cluster/prod-eks
  context: { cluster: prod-eks, user: u }
- name: gke_proj_us-central1_staging-gke
  context: { cluster: staging-gke, user: u }
current-context: kind-dev
