[package]
name = "kubebay"
version = "0.2.0"
description = "Local-first Kubernetes IDE"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-shell = "2"
serde_json = "1"
ctrlc = { version = "3", features = ["termination"] }
